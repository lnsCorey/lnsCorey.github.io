:"Webring Studio by Corey Lines","tagline":"Personal, private, peer-to-peer, federated and algorithm free.","bio":"Welcome to this Webring Studio social media publication! Everything here is hosted as static JSON \u0026 HTML, managed locally, published \u0026 synced from the Webring Studio application, and federated across my group of friends.","location":"","avatarUrl":"media/profile/avatar-08fc69db5427854173de.png","bannerUrl":"media/profile/banner-e84781d5356553541a5a.png","interests":["webring","indieweb","html","javascript","css","federated","personal","private","secure","algorithm free"],"customLinks":[{"label":"My Webring Feed","url":"./api/manifest.json"},{"label":"DID Identity","url":"./.well-known/did.json"}],"theme":"xtraspecial","appearance":{"accent":"#22d3ee"},"atprotoHandle":"","updatedAt":"2026-11-24T14:15:56.787Z","proof":{"type":"Ed25519Signature2020","created":"2026-11-24T14:15:56.787Z","verificationMethod":"did:web:lnscorey.github.io#key-1","signatureValue":"PuXkzL39eoOw8YO13D5IqmLeZZAVJZaBSYvDMttvv_0_TjlthPogkJJvm2x3a2DyUdg_932nMzrXgzujLgS1BQ"}},"albums":{"schemaVersion":"1.0.0","siteUrl":"https://lnscorey.github.io","did":"did:web:lnscorey.github.io","updatedAt":"2026-11-22T15:18:14.661Z","albums":[],"proof":{"type":"Ed25519Signature2020","created":"2026-11-22T15:18:14.661Z","verificationMethod":"did:web:lnscorey.github.io#key-1","signatureValue":"Xj0sNAuck6ZobwX5-PFElnBIyMDkrRTqjerytZVhcpmBBpVrtCl0goBl0sisATvfhTH3XpAFY2D0ozWNwHiHDQ"}},"items":{"schemaVersion":"1.0.0","siteUrl":"https://lnscorey.github.io","did":"did:web:lnscorey.github.io","updatedAt":"2026-11-22T15:18:14.661Z","items":[{"id":"item-f19a45b2","canonicalUrl":"https://lnscorey.github.io/api/items.json#item-item-f19a45b2","type":"post","title":"Webring Studio Overview","targetUrl":"https://lnscorey.github.io/api/items.json#item-item-f19a45b2","category":"general","commentary":"**Webring Studio is split into two halves.**\n\nThe engine:\n\n**The Webring Studio desktop app.**\n\nYou write posts, manage photo albums, follow friends and run webrings here. It keeps everything in a local SQLite database, signs what you publish, and fetches your friends' sites when you sync.\n\n**The artifact: your public site.**\n\nPublishing produces a folder of static files (HTML, JSON and media) that you can host anywhere: GitHub Pages, any SFTP/FTP host, or a folder on your own server. Nothing on the public site needs a server-side runtime.\n\nSites talk to each other only through those static files. Each site publishes signed JSON (/api/manifest.json, profile.json, items.json, albums.json, connections.json), and its identity is a did:web with an Ed25519 key. When you sync, Studio pulls your friends' JSON, checks the signatures, and builds your feed locally. Likes, replies and comments you make become signed entries on your site, which the other person's Studio picks up the next time it syncs.\n\n**Highlights:**\n\nProfile, wall posts, threaded replies, likes, shares and photo albums\nFriends, with a private-by-default social graph and mute/block\nCurated webrings with Prev / Next / Random navigation\nMultiple personas, fully separated from one another\nScheduled syncing and publishing, running from the menu bar\nAn MCP server so AI agents can work with Studio for you\nOptional add-ons: Google Analytics, AdSense and GitHub-based comments (all off by default)","mediaUrl":"","tags":["webring","webring-studio","private","personal","#algorithm-free"],"createdAt":"2026-11-22T15:17:36.213Z"},{"id":"item-0405c727","canonicalUrl":"https://lnscorey.github.io/api/items.json#item-item-0405c727","type":"post","title":"Webring Studio on Github","targetUrl":"https://lnscorey.github.io/api/items.json#item-item-0405c727","category":"general","commentary":"Webring Studio is located here: [https://github.com/lnsCorey/webring-studio](https://github.com/lnsCorey/webring-studio)\n\nIf you download Webring Studio, add me: https://lines2code.com/social/","mediaUrl":"","tags":[],"createdAt":"2026-11-22T15:15:12.456Z"},{"id":"item-c9fc2a4a","canonicalUrl":"https://lnscorey.github.io/api/items.json#item-item-c9fc2a4a","type":"post","title":"What is Webring Studio?","targetUrl":"https://lnscorey.github.io/api/items.json#item-item-c9fc2a4a","category":"general","commentary":"Webring Studio is a free desktop app for running your own corner of the social web, while the site you publish stays plain static files. It combines three ideas:\n\nA personal profile site you own. Write posts, share photos, recommend things, and publish a static site to GitHub Pages, your own domain (SFTP/FTP) or a local folder. The site is only HTML, CSS and JSON files, so it needs no server, database or account. Choose from classic themes or social-style templates, and arrange your page with drag-and-drop blocks.\nSigned, verifiable data. Your identity is a did:web address with an Ed25519 key. Every file you publish is cryptographically signed, so friends can check that it really came from you and wasn't changed.\nWebrings, reborn. Create or join curated rings. Ring hubs are static, signed files too, so a ring needs no server. You choose who joins, and a ring can remove or ban members.\nEverything dynamic happens on your computer and not on a server: writing, signing, syncing with friends, building your neighborhood feed and publishing. Friends are added by their site address, and \"syncing\" just means fetching their signed files. The same engine can be driven by an AI agent through its built-in MCP interface.","mediaUrl":"","tags":["webring studio","information","features"],"createdAt":"2026-11-22T15:13:54.575Z"},{"id":"item-6420eb56","canonicalUrl":"https://lnscorey.github.io/api/items.json#item-item-6420eb56","type":"post","title":"What is a Webring? (a little history)","targetUrl":"https://lnscorey.github.io/api/items.json#item-item-6420eb56","category":"general","commentary":"A webring is a group of websites joined in a loop. Each site carries a small navigation bar with ← Previous, Next → and Random links, so a visitor can hop from site to site around the ring without a search engine or feed.\n\nWebrings appeared in the mid-1990s, in the early days of personal home pages. The best-known service, WebRing, was later acquired by Yahoo. Rings were how people found each other. A fan of astronomy, 90s anime or a small town would find one site, then follow the ring to dozens more, each run by a real person. Rings were curated by hand, since the owner chose who could join, and made of personal sites, not accounts on someone else's platform.\n\nThey faded as search engines got good and social networks took over discovery. In recent years webrings have come back with the IndieWeb and small web movements, as people look for a more human, less algorithm-driven web.","mediaUrl":"","tags":["webring","history","context"],"createdAt":"2026-11-22T15:12:58.580Z"}],"proof":{"type":"Ed25519Signature2020","created":"2026-11-22T15:18:14.661Z","verificationMethod":"did:web:lnscorey.github.io#key-1","signatureValue":"PU0_daSK1hQkvf7uO5CzvoQeXieSqRS9sNKgi4w4V7Sz4BSTsj_RSvFkCh6RZ47rRpBiBmDhsTqfpo0sEHzQCA"}},"connections":{"schemaVersion":"1.0.0","siteUrl":"https://lnscorey.github.io","did":"did:web:lnscorey.github.io","updatedAt":"2026-11-20T20:42:42.604Z","friends":[],"webrings":[],"endorsements":[],"proof":{"type":"Ed25519Signature2020","created":"2026-11-20T20:42:42.604Z","verificationMethod":"did:web:lnscorey.github.io#key-1","signatureValue":"SNpIyaWMxNzcQ30KJbYndM3p90ESLh9ND-17cVsApztlFZG9A5QwmfJkAcVfqBqvjuh0_TjFzbkCtBfN7I62Dw"}}};</script>

  <style>
    body.theme-neo-webring { background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    body.theme-minimal-zine { background: #fafaf9; color: #1c1917; font-family: Georgia, Cambria, serif; }
    body.theme-cyber-terminal { background: #050505; color: #4ade80; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    body.theme-cozy-scrapbook { background: #fef3c7; color: #451a03; font-family: system-ui, -apple-system, sans-serif; }
    .card-surface { background: rgba(30, 41, 59, 0.75); border: 1px solid rgba(148, 163, 184, 0.2); }
    body.theme-minimal-zine .card-surface { background: #ffffff; border: 1px solid #e7e5e4; color: #1c1917; }
    body.theme-cyber-terminal .card-surface { background: #0a0f0d; border: 1px solid #22c55e; color: #4ade80; }
    body.theme-cozy-scrapbook .card-surface { background: #fffbeb; border: 2px solid #d97706; color: #451a03; }
    /* Look & feel options (Site Design); each applies only when set */
    body[data-font="sans"] { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif !important; }
    body[data-font="serif"] { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif !important; }
    body[data-font="rounded"] { font-family: ui-rounded, "SF Pro Rounded", Nunito, "Varela Round", system-ui, sans-serif !important; }
    body[data-font="mono"] { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace !important; }
    body[data-corners="sharp"] .card-surface, body[data-corners="sharp"] .rounded, body[data-corners="sharp"] .rounded-lg,
    body[data-corners="sharp"] .rounded-xl, body[data-corners="sharp"] .rounded-2xl { border-radius: 0 !important; }
    body[data-corners="soft"] .card-surface, body[data-corners="soft"] .rounded-xl,
    body[data-corners="soft"] .rounded-2xl { border-radius: 1.5rem !important; }
    body[data-surface="flat"] .card-surface { background: transparent !important; border-color: transparent !important; box-shadow: none !important; }
    body[data-banner="short"] .profile-banner { height: 8rem !important; }
    body[data-banner="tall"] .profile-banner { height: 22rem !important; }
    body[data-avatar="circle"] .profile-avatar { border-radius: 9999px !important; }
    body[data-accent] .accent-solid { background: var(--accent) !important; color: var(--accent-ink) !important; }
    body[data-accent] .accent-soft { background: color-mix(in srgb, var(--accent) 20%, transparent) !important; color: var(--accent) !important; }
    body[data-accent] .accent-text { color: var(--accent) !important; }
    body[data-background="gradient"] { background-image: linear-gradient(160deg, color-mix(in srgb, var(--accent, #6366f1) 24%, transparent), transparent 60%) !important; background-attachment: fixed; }
    body[data-background="banner-blur"]::before { content: ""; position: fixed; inset: -60px; z-index: -1; background-image: var(--banner-image); background-size: cover; background-position: center; filter: blur(48px) saturate(1.2); opacity: 0.35; }
    /* Text blocks */
    .album-cards-row .album-card { flex: 0 0 11rem; }
    .prose-block h2 { font-size: 1.4rem; font-weight: 700; margin: 1.1rem 0 0.5rem; }
    .prose-block h3 { font-size: 1.2rem; font-weight: 700; margin: 1rem 0 0.4rem; }
    .prose-block h4, .prose-block h5 { font-weight: 700; margin: 0.9rem 0 0.3rem; }
    .prose-block p { margin: 0.5rem 0; line-height: 1.65; }
    .prose-block ul { list-style: disc; padding-left: 1.5rem; margin: 0.5rem 0; }
    .prose-block ol { list-style: decimal; padding-left: 1.5rem; margin: 0.5rem 0; }
    .prose-block a { text-decoration: underline; }
    .prose-block blockquote { border-left: 3px solid var(--accent, #6366f1); padding-left: 1rem; margin: 0.75rem 0; opacity: 0.9; }
    .prose-block code { background: rgba(0, 0, 0, 0.25); padding: 0.1rem 0.35rem; border-radius: 0.25rem; font-size: 0.9em; }
    .prose-block pre { background: rgba(0, 0, 0, 0.3); padding: 0.75rem 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.75rem 0; }
    .prose-block pre code { background: none; padding: 0; }
    .prose-block table { width: 100%; border-collapse: collapse; margin: 0.75rem 0; font-size: 0.95em; }
    .prose-block th, .prose-block td { border: 1px solid rgba(148, 163, 184, 0.35); padding: 0.4rem 0.65rem; text-align: left; }
    .prose-block th { font-weight: 700; background: rgba(148, 163, 184, 0.12); }
    .prose-block hr { border: 0; border-top: 1px solid rgba(148, 163, 184, 0.3); margin: 1rem 0; }
    .album-description { max-width: 48rem; }
    .post-body > :first-child { margin-top: 0; }
    .post-body > :last-child { margin-bottom: 0; }
    .album-description p:first-child, .album-description h2:first-child, .album-description h3:first-child { margin-top: 0.25rem; }

    /* Shared template pieces */
    body.tpl-light .text-indigo-300, body.tpl-light .text-emerald-300, body.tpl-light .text-pink-300,
    body.tpl-light .text-purple-300, body.tpl-light .text-sky-300, body.tpl-light .text-amber-300 { color: var(--accent, var(--tpl-accent, #4338ca)); }
    body.tpl-light .border-white\/10, body.tpl-light .border-white\/20 { border-color: rgba(0, 0, 0, 0.08); }
    body.tpl-light .bg-white\/10, body.tpl-light .bg-white\/5 { background: rgba(0, 0, 0, 0.05); }
    body.tpl-light .bg-black\/20, body.tpl-light .bg-black\/30 { background: rgba(0, 0, 0, 0.04); }
    body:not(.shell-stack) #profile-root { max-width: 72rem; }
    body.shell-deck #profile-root { max-width: none; }
    .tpl-muted { opacity: 0.65; }
    .tpl-accent { color: var(--accent, var(--tpl-accent)); }
    .tpl-btn { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.45rem 1rem; border-radius: 9999px; font-weight: 700; font-size: 0.85rem; }
    .tpl-btn-solid { background: var(--accent, var(--tpl-accent)); color: var(--accent-ink, #fff); }
    .tpl-btn-ghost { border: 1px solid var(--tpl-line); }
    .tpl-avatar { border-radius: 9999px; object-fit: cover; flex-shrink: 0; }
    .tpl-avatar-blank { display: flex; align-items: center; justify-content: center; font-weight: 800; background: var(--accent, var(--tpl-accent)); color: var(--accent-ink, #fff); }
    .tpl-chip { font-size: 0.7rem; padding: 0.1rem 0.5rem; border-radius: 9999px; background: color-mix(in srgb, var(--accent, var(--tpl-accent)) 15%, transparent); color: var(--accent, var(--tpl-accent)); font-weight: 600; }
    .tpl-tabs { display: flex; gap: 0.25rem; overflow-x: auto; border-top: 1px solid var(--tpl-line); padding: 0.25rem 1rem; }

    .tpl-tabs a:hover { opacity: 1; border-bottom-color: var(--accent, var(--tpl-accent)); }
    .tpl-block { scroll-margin-top: 1rem; }
    .tpl-media { width: 100%; max-height: 32rem; object-fit: cover; margin-top: 0.6rem; border-radius: 0.5rem; }
    body:not(.shell-stack) .accent-solid { background: var(--accent, var(--tpl-accent)); color: var(--accent-ink, #fff); }
    body:not(.shell-stack) .accent-soft { background: color-mix(in srgb, var(--accent, var(--tpl-accent)) 15%, transparent); color: var(--accent, var(--tpl-accent)); }
    body:not(.shell-stack) .accent-text { color: var(--accent, var(--tpl-accent)); }
    .tpl-actions { display: flex; flex-wrap: wrap; gap: 0.25rem; font-size: 0.8rem; font-weight: 600; }
    .tpl-actions a, .tpl-actions button { padding: 0.35rem 0.7rem; border-radius: 0.5rem; opacity: 0.8; }
    .tpl-actions a:hover, .tpl-actions button:hover { opacity: 1; background: color-mix(in srgb, var(--accent, var(--tpl-accent)) 12%, transparent); color: var(--accent, var(--tpl-accent)); }
    .tpl-comments { margin-top: 0.5rem; display: grid; gap: 0.4rem; font-size: 0.8rem; }
    .tpl-comments div { padding: 0.45rem 0.7rem; border-radius: 0.9rem; background: color-mix(in srgb, currentColor 6%, transparent); }
    .tpl-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.35rem; }
    .tpl-carousel { display: flex; gap: 0.5rem; overflow-x: auto; scroll-snap-type: x mandatory; }
    .tpl-carousel > * { flex: 0 0 11rem; scroll-snap-align: start; }
    .tpl-tile { position: relative; aspect-ratio: 1 / 1; overflow: hidden; background: color-mix(in srgb, currentColor 8%, transparent); }
    .tpl-tile > a { display: block; height: 100%; }
    .tpl-tile > img, .tpl-tile > a > img { width: 100%; height: 100%; object-fit: cover; }
    .tpl-tile-text { display: flex; flex-direction: column; justify-content: center; height: 100%; padding: 0.9rem; font-size: 0.85rem; overflow: hidden; background: linear-gradient(140deg, color-mix(in srgb, var(--accent, var(--tpl-accent)) 30%, transparent), transparent); }
    .tpl-tile-text strong { display: block; margin-bottom: 0.3rem; }
    .tpl-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.5rem; text-align: center; background: rgba(0, 0, 0, 0.55); color: #fff; font-weight: 700; font-size: 0.8rem; opacity: 0; transition: opacity 0.15s; pointer-events: none; }

      // Hub-supplied addresses are untrusted: absolute https only, no credentials
      function ringSiteUrl(value) {

      async function fetchRingHub(hubUrl) {
        const controller = new AbortController();
        const timer = setTimeout(function() { controller.abort(); }, 2000);
        try {
          const res = await fetch(hubUrl, { credentials: 'omit', referrerPolicy: 'no-referrer', cache: 'no-store', signal: controller.signal });
          if (!res.ok) return null;
          const text = await res.text();
          if (text.length > 1000000) return null;
          const doc = JSON.parse(text);
          if (!doc || !Array.isArray(doc.members) || doc.status === 'closed') return null;
          return doc;
        } catch (e) {
          return null;
        } finally {
          clearTimeout(timer);
        }

        return '<a class="album-card" href="' + albumHref(album) + '" data-album-link="' + esc(album.id) + '">' +
          '<span class="album-card-cover">' + (cover ? '<img src="' + safeUrl(cover) + '" alt="" loading="lazy" />' : '<span class="album-card-blank"></span>') + '</span>' +
          '<span class="album-card-title">' + esc(album.title) + '</span>' +
          '<span class="album-card-count">' + albumPhotosLabel(album, false) + '</span></a>';
      }

      function renderAlbumPost(album) {
        const d = album.createdAt ? new Date(album.createdAt) : null;
        const when = d && !isNaN(d.getTime()) ? ' · ' + esc(d.toLocaleDateString()) : '';
        return '<div class="card-surface rounded-xl p-4 md:col-span-2 album-post">' +
          '<p class="text-xs opacity-70 mb-2">' + esc(profile.displayName) + ' posted an album' + when + '</p>' +
          albumPeek(album) +
          '<p class="font-bold mt-2">' + esc(album.title) + '</p>' +
          '<a href="' + albumHref(album) + '" class="text-sm underline">Open album →</a></div>';
      }

      // Items plus posted albums, newest first. Albums count as posts, so a kind filter without posts leaves them out.
      function timelineEntries(list, kinds, limit) {
        const wanted = !kinds || !kinds.length || kinds.indexOf('post') !== -1;
        let entries = kinds && kinds.length ? list.filter(i => kinds.indexOf(i.type) !== -1) : list.slice();
        if (wanted) {
          allAlbums.filter(albumPosted).forEach(function(a) {
            entries.push({ type: 'album', id: 'album-' + a.id, createdAt: a.createdAt, album: a });
          });
        }
        const time = (e) => { const t = Date.parse(e.createdAt); return isNaN(t) ? 0 : t; };
        entries = entries.map((e, i) => ({ e: e, i: i })).sort((x, y) => (time(y.e) - time(x.e)) || (x.i - y.i)).map(x => x.e);
        return limit ? entries.slice(0, limit) : entries;
      }

      // A post whose title is just its opening Markdown heading shows the heading only
      function titleIsOpeningHeading(item) {
        if (item.type !== 'post') return false;
        const first = String(item.commentary || '').trim().split('\n')[0];
        return /^#{1,6}\s/.test(first) && markdownToPlainText(first) === item.title;
      }

      // "edited" next to an item that changed after it was first published
      function editedNote(item) {
        const d = item.updatedAt ? new Date(item.updatedAt) : null;
        if (!d || isNaN(d.getTime())) return '';
        return ' • <span class="item-edited" title="Edited ' + esc(d.toLocaleString()) + '">edited</span>';
      }

      function renderItem(item) {
        const badgeColor = item.type === 'post'
          ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
          : item.type === 'like'
          ? 'bg-pink-500/20 text-pink-300'
          : item.type === 'recommendation'
          ? 'bg-amber-500/20 text-amber-300'
          : item.type === 'comment'
          ? 'bg-purple-500/20 text-purple-300'
          : 'bg-sky-500/20 text-sky-300';
        const endorsements = getEndorsementsFor(item.canonicalUrl).filter(e => e.type !== 'comment');
        const comments = getCommentsFor(item.canonicalUrl);
        const isSelfPost = item.type === 'post' && (!item.targetUrl || item.targetUrl === item.canonicalUrl);
        const liveContainerId = 'live-comments-' + esc(item.id);
        const hasLiveProvider = profile.commentConfig && profile.commentConfig.provider && profile.commentConfig.provider !== 'none';

        return `
          <div class="card-surface rounded-xl p-4 flex flex-col justify-between ${item.type === 'post' ? 'md:col-span-2' : ''}">
            <div>
              <div class="flex items-center justify-between gap-2 mb-2">
                <span class="text-xs uppercase tracking-wider font-bold px-2.5 py-0.5 rounded-full ${badgeColor}">${item.type === 'post' ? '📝 Wall Post' : esc(item.type)}</span>
                <span class="text-xs opacity-60">${esc(item.category)} ${item.rating && item.type !== 'post' && item.type !== 'comment' ? '• ' + '★'.repeat(Math.min(5, Math.max(1, Number(item.rating) || 5))) : ''}${editedNote(item)}</span>
              </div>
              ${item.mediaUrl ? `<img src="${safeUrl(item.mediaUrl)}" class="w-full ${item.type === 'post' ? 'max-h-80' : 'h-40'} object-cover rounded-lg mb-3" />` : ''}
              ${titleIsOpeningHeading(item) ? '' : `<h4 class="font-bold text-base mb-1">
                ${isSelfPost ? `<span>${esc(item.title)}</span>` : `<a href="${safeUrl(item.targetUrl)}" target="_blank" rel="noopener noreferrer" class="hover:underline">${esc(item.title)} ↗</a>`}
              </h4>`}
              ${item.targetAuthorName ? `<p class="text-xs opacity-70 mb-2">${item.type === 'comment' ? 'Replying to' : 'Source'}: <a href="${safeUrl(item.targetAuthorUrl || item.targetUrl)}" target="_blank" rel="noopener noreferrer" class="underline">${esc(item.targetAuthorName)}</a></p>` : ''}
              ${item.type === 'post'
                ? (item.commentary ? `<div class="prose-block post-body text-sm opacity-90 mb-3">${renderMarkdown(item.commentary)}</div>` : '')
                : `<p class="text-sm opacity-90 mb-3 whitespace-pre-line">${esc(item.commentary || '')}</p>`}
              <div class="flex flex-wrap gap-1.5 mb-3">
                ${(item.tags || []).map(t => `<span class="text-xs px-2 py-0.5 rounded bg-white/5 opacity-75">#${esc(t)}</span>`).join('')}
              </div>
              ${endorsements.length > 0 ? `
                <div class="text-xs opacity-85 bg-emerald-500/10 border border-emerald-500/20 rounded px-2.5 py-1.5 mb-3">
                  ↻ Endorsed by ${endorsements.map(e => esc(e.authorName)).join(', ')}
                </div>
              ` : ''}
              ${comments.length > 0 ? `
                <div class="mt-3 mb-3 pt-2.5 border-t border-white/10 space-y-2">
                  <p class="text-xs font-bold opacity-80">💬 Comments (${comments.length})</p>
                  ${comments.map(c => `
                    <div class="p-2.5 rounded-lg bg-black/20 border border-white/10 text-xs space-y-1">
                      <div class="flex items-center justify-between">
                        <a href="${safeUrl(c.authorSiteUrl)}" target="_blank" rel="noopener noreferrer" class="accent-text font-bold text-indigo-300 hover:underline">${esc(c.authorName)}</a>
                      </div>
                      <p class="opacity-90 whitespace-pre-line">${esc(c.commentary || '')}</p>
                    </div>
                  `).join('')}
                </div>
              ` : ''}
              <div id="${liveContainerId}" class="hidden mt-3 mb-3 p-3 rounded-xl bg-black/30 border border-indigo-500/30"></div>
            </div>
            <div class="pt-2 border-t border-white/10 flex flex-wrap items-center justify-between gap-2 text-xs">
              <span class="flex items-center gap-3">
                <a href="${safeUrl(item.canonicalUrl)}" class="opacity-60 hover:opacity-100">Schema URI</a>
                <button type="button" data-open-post="${esc(item.id)}" class="opacity-70 hover:opacity-100 font-medium" aria-label="Open post">⤢ Open</button>
              </span>
              <div class="flex flex-wrap gap-2">
                <a href="${buildDeepLink('like', item.canonicalUrl, item.title, item.mediaUrl, item.category)}" class="px-2.5 py-1 rounded bg-pink-500/20 text-pink-300 hover:bg-pink-500/30 font-medium">♥ Like</a>
                <a href="${buildDeepLink('comment', item.canonicalUrl, item.title, item.mediaUrl, 'comment')}" class="px-2.5 py-1 rounded bg-emerald-500/20 text-emerald-300 hover:bg-emerald-500/30 font-medium">💬 Comment</a>
                <a href="${buildDeepLink('share', item.targetUrl, item.title, item.mediaUrl, item.category)}" class="accent-soft px-2.5 py-1 rounded bg-indigo-500/20 text-indigo-300 hover:bg-indigo-500/30 font-medium">↻ Re-Share</a>
                ${hasLiveProvider ? `<button data-container="${liveContainerId}" data-canonical="${esc(item.canonicalUrl)}" data-action="live-thread" class="px-2.5 py-1 rounded bg-purple-500/20 text-purple-300 hover:bg-purple-500/30 font-medium">💬 Live Thread</button>` : ''}
              </div>
            </div>
          </div>
        `;
      }

      // Friends' avatars only from their own site over https; otherwise a local placeholder (src/shared/avatar.ts)

      function safeAvatarUrl(avatarUrl, siteUrl) {
        if (!avatarUrl || !siteUrl) return null;
        try {
          var avatar = new URL(avatarUrl);
          var site = new URL(siteUrl);
          if (avatar.protocol !== 'https:') return null;
          if (avatar.origin !== site.origin) return null;
          return avatar.href;
        } catch (e) {
          return null;
        }
      }

      function localAvatarDataUri(seed) {
        var text = String(seed || '');
        var host = text;
        try { host = new URL(text).hostname; } catch (e) {}
        var first = host.replace(/^www\./i, '').charAt(0).toUpperCase();
        var label = /^[A-Z0-9]$/.test(first) ? first : '?';
        var hash = 0;
        for (var i = 0; i < text.length; i++) hash = (hash * 31 + text.charCodeAt(i)) >>> 0;
        var hue = hash % 360;
        var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="32" fill="hsl(' + hue + ',55%,38%)"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="28" font-weight="700">' + label + '</text></svg>';
        return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      }

      function renderFriend(friend) {
        return `
          <a href="${safeUrl(friend.siteUrl)}" target="_blank" rel="noopener noreferrer" class="card-surface rounded-xl p-3.5 flex items-center gap-3 hover:border-indigo-400/50 transition">
            <img src="${esc(safeAvatarUrl(friend.avatarUrl, friend.siteUrl) || localAvatarDataUri(friend.siteUrl))}" referrerpolicy="no-referrer" alt="" class="w-12 h-12 rounded-full object-cover border border-white/20" />
            <div class="min-w-0 flex-1">
              <h4 class="font-bold text-sm truncate">${esc(friend.displayName)}</h4>
              <p class="text-xs opacity-70 truncate">${esc(friend.siteUrl)}</p>
              <div class="flex flex-wrap gap-1 mt-1">
                ${(friend.relationship || []).map(rel => `<span class="accent-soft text-[10px] px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-300">${esc(rel)}</span>`).join('')}
              </div>
            </div>
          </a>
        `;
      }

      function renderAdSlot(slotId, label) {
        const adsCfg = profile.adsAddon;
        if (!adsCfg || !adsCfg.enabled || !adsCfg.publisherId || !/^[0-9]{5,20}$/.test(String(slotId || '').trim())) {
          return '';
        }
        const cleanClient = esc(adsCfg.publisherId);
        const cleanSlot = esc(String(slotId).trim());
        return `
          <div class="card-surface rounded-xl p-3 mb-8 text-center overflow-hidden" data-ad-position="${esc(label)}">
            <p class="text-[10px] uppercase tracking-wider opacity-50 mb-1.5">Sponsored • ${esc(label)}</p>
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="${cleanClient}"
                 data-ad-slot="${cleanSlot}"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
          </div>
        `;
      }

      const headerAdHtml = renderAdSlot(profile.adsAddon && profile.adsAddon.headerSlotId, 'Profile Banner Slot');
      const inFeedAdHtml = renderAdSlot(profile.adsAddon && profile.adsAddon.inFeedSlotId, 'In-Feed Slot');
      const footerAdHtml = renderAdSlot(profile.adsAddon && profile.adsAddon.footerSlotId, 'Footer Slot');

      // Page blocks (Site Design). A block's title replaces the default heading; an empty title hides it.
      let photosAnchorUsed = false;
      function section(block, defaultTitle, inner) {
        const title = typeof block.title === 'string' ? block.title : defaultTitle;
        // The first albums section is where "Albums" links from friends land
        const anchorId = block.type === 'albums' && !photosAnchorUsed ? (photosAnchorUsed = true, ' id="photos"') : '';
        return '<section class="mb-12"' + anchorId + ' data-block="' + esc(block.type) + '">' +
          (title ? '<h2 class="text-2xl font-bold mb-4 flex items-center gap-2">' + esc(title) + '</h2>' : '') +
          inner + '</section>';
      }
      const emptyNote = (text) => '<p class="opacity-60 text-sm">' + esc(text) + '</p>';
      const allItems = items.items || [];
      const allAlbums = albums.albums || [];
      const allFriends = connections.friends || [];
      const linkButtons = (links, rel) => '<div class="flex flex-wrap gap-3">' + (links || [])
        .filter(l => l && l.url)
        .map(l => '<a href="' + safeUrl(l.url) + '" target="_blank" rel="noopener noreferrer' + (rel ? ' ' + rel : '') + '" class="accent-solid px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm shadow">' + esc(l.label || l.url) + '</a>')
        .join('') + '</div>';
      const commentCfg = profile.commentConfig || {};
      const hasGuestbook = (commentCfg.provider === 'giscus' || commentCfg.provider === 'utterances') && commentCfg.giscusRepo;

      // The guestbook is a page-wide comment thread, loaded only when a visitor asks for it
      window.openGuestbook = function() {
        window.toggleLiveCommentThread('guestbook-thread', profile.siteUrl + '#guestbook');
      };
      // The page has no inline event handlers (its CSP forbids them): buttons say what they do in data-action
      document.addEventListener('click', function(ev) {
        const button = ev.target && ev.target.closest ? ev.target.closest('[data-action]') : null;
        if (!button) return;
        const action = button.getAttribute('data-action');
        if (action === 'live-thread') {
          window.toggleLiveCommentThread(button.getAttribute('data-container'), button.getAttribute('data-canonical'));
        } else if (action === 'guestbook') {
          window.openGuestbook();
        }
      });

      const blockRenderers = {
        albums: (b) => {
          const ids = b.options && Array.isArray(b.options.albumIds) && b.options.albumIds.length ? b.options.albumIds : null;
          const list = ids ? allAlbums.filter(a => ids.includes(a.id)) : allAlbums;
          const carousel = b.options && b.options.style === 'carousel';
          const cards = list.filter(a => !albumShownExpanded(a));
          const cardsHtml = cards.length
            ? '<div class="mb-8 ' + (carousel ? 'flex gap-4 overflow-x-auto snap-x pb-2 album-cards-row' : 'grid grid-cols-2 md:grid-cols-3 gap-4 album-cards-grid') + '">' + cards.map(renderAlbumCard).join('') + '</div>'
            : '';
          const html = cardsHtml + list.filter(albumShownExpanded).map(a => renderAlbum(a, b.options && b.options.style)).join('');
          return section(b, '📸 Photo Albums', html || emptyNote('No photo albums published yet.'));
        },
        items: (b) => {
          const kinds = b.options && Array.isArray(b.options.kinds) ? b.options.kinds : null;
          const list = timelineEntries(allItems, kinds, b.options && b.options.limit);
          return section(b, '✨ Shared Items & Things I Like',
            '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">' + (list.map(i => i.type === 'album' ? renderAlbumPost(i.album) : renderItem(i)).join('') || emptyNote('Nothing shared here yet.')) + '</div>');
        },
        friends: (b) => allFriends.length
          ? section(b, '🤝 Friend Ring & Connections (' + allFriends.length + ')',
              '<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">' + allFriends.map(renderFriend).join('') + '</div>')
          : '',
        text: (b) => {
          const markdown = b.options && b.options.markdown;
          return markdown ? section(b, '', '<div class="card-surface rounded-xl p-5 prose-block">' + renderMarkdown(markdown) + '</div>') : '';
        },
        image: (b) => {
          const o = b.options || {};
          if (!o.url) return '';
          const img = '<img src="' + safeUrl(o.url) + '" alt="' + esc(o.alt || '') + '" class="w-full rounded-xl object-cover" />';
          const linked = o.link ? '<a href="' + safeUrl(o.link) + '" target="_blank" rel="noopener noreferrer">' + img + '</a>' : img;
          return section(b, '', '<figure class="card-surface rounded-xl overflow-hidden p-2">' + linked +
            (o.caption ? '<figcaption class="text-sm opacity-80 px-2 pt-2 pb-1">' + esc(o.caption) + '</figcaption>' : '') + '</figure>');
        },
        links: (b) => (b.options && (b.options.links || []).length) ? section(b, '', linkButtons(b.options.links, '')) : '',
        featured: (b) => {
          const target = b.options && b.options.canonicalUrl;
          if (!target) return '';
          const item = allItems.find(i => i.canonicalUrl === target);
          if (item) return section(b, '⭐ Featured', '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">' + renderItem(item) + '</div>');
          const album = allAlbums.find(a => a.canonicalUrl === target);
          if (album) return section(b, '⭐ Featured', '<div class="grid grid-cols-2 md:grid-cols-3 gap-4">' + renderAlbumCard(album) + '</div>');
          for (const a of allAlbums) {
            const photo = (a.photos || []).find(p => p.canonicalUrl === target);
            if (photo) return section(b, '⭐ Featured', '<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">' + renderPhotoCard(photo, a, '') + '</div>');
          }
          return '';
        },
        contact: (b) => (b.options && (b.options.entries || []).length) ? section(b, '✉️ Contact & Elsewhere', linkButtons(b.options.entries, 'me')) : '',
        rings: (b) => {
          const rings = (connections.webrings || []).filter(r => r && r.name && (r.directoryUrl || r.hubUrl));
          if (!rings.length) return '';
          const cards = rings.map(r => {
            const href = safeUrl(r.directoryUrl || r.hubUrl);
            const count = typeof r.memberCount === 'number' && r.memberCount > 0 ? r.memberCount + ' member' + (r.memberCount === 1 ? '' : 's') : '';
            return '<a href="' + href + '" target="_blank" rel="noopener noreferrer" class="card-surface rounded-xl p-4 block hover:opacity-90">' +
              '<span class="accent-soft text-[10px] px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 font-semibold">WEBRING</span>' +
              '<h3 class="font-bold mt-2">' + esc(r.name) + '</h3>' +
              (r.description ? '<p class="text-sm opacity-80 mt-1">' + esc(r.description) + '</p>' : '') +
              (count ? '<p class="text-xs opacity-60 mt-2">' + count + '</p>' : '') +
            '</a>';
          }).join('');
          return section(b, '🔗 Webrings (' + rings.length + ')', '<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">' + cards + '</div>');
        },
        guestbook: (b) => hasGuestbook
          ? section(b, '📖 Guestbook', '<div class="card-surface rounded-xl p-4"><button data-action="guestbook" class="accent-solid px-4 py-2 rounded-xl bg-indigo-600 text-white text-sm font-semibold">Open Guestbook</button><div id="guestbook-thread" class="hidden mt-3"></div></div>')
          : '',
      };

      const layout = Array.isArray(profile.layout) ? profile.layout : DEFAULT_LAYOUT;
      const visibleBlocks = layout
        .filter(b => b && b.visible !== false && Object.prototype.hasOwnProperty.call(blockRenderers, b.type));
      const renderedBlocks = visibleBlocks
        .map(b => blockRenderers[b.type](b))
        .filter(Boolean);
      // The in-feed ad slot goes after the first block, as it did between albums and items
      const blocksHtml = renderedBlocks.length
        ? renderedBlocks[0] + inFeedAdHtml + renderedBlocks.slice(1).join('')
        : inFeedAdHtml;

      // Older posts: items.json holds the recent window; signed monthly archives hold the rest and
      // load on request (in the preview they're embedded, since it can't fetch)
      const archiveMonths = items.archive && Array.isArray(items.archive.months)
        ? items.archive.months.filter(m => m && /^\/?api\/archive\/items-\d{4}-\d{2}\.json$/.test(String(m.url)) && /^\d{4}-\d{2}$/.test(String(m.month)))
        : [];
      const monthLabel = (month) => {
        const d = new Date(month + '-01T00:00:00Z');
        return isNaN(d.getTime()) ? month : d.toLocaleDateString(undefined, { month: 'long', year: 'numeric', timeZone: 'UTC' });
      };
      const showsItems = visibleBlocks.some(b => b.type === 'items');
      const olderPostsHtml = archiveMonths.length && showsItems
        ? '<section class="mb-12 older-posts" data-archive><h2 class="text-2xl font-bold mb-4">Older posts</h2>' +
          '<div class="flex flex-wrap gap-2">' + archiveMonths.map(m =>
            '<button type="button" class="older-month px-3 py-1.5 rounded-lg card-surface text-sm" data-archive-url="' + esc(m.url) + '" data-archive-label="' + esc(monthLabel(m.month)) + '">' +
            esc(monthLabel(m.month)) + ' <span class="opacity-60">(' + (Number(m.count) || 0) + ')</span></button>').join('') +
          '</div><div class="older-list mt-4" data-archive-list></div></section>'

      // Interactive extras: lightbox, post view, sortable tables (pageEnhancements.ts)
      const installPageEnhancements = function installPageEnhancements(ctx) {
    const doc = document;
    const root = ctx.root;
    const esc = ctx.esc;
    const safeUrl = ctx.safeUrl;
    const link = ctx.buildDeepLink;
    // Sortable tables: header buttons sort the rows, numbers in number order
    const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
    root.querySelectorAll('.prose-block table').forEach((table) => {
        const head = table.tHead;
        const body = table.tBodies && table.tBodies[0];
        if (!head || !body || !head.rows[0] || body.rows.length < 2)
            return;
        const headers = Array.prototype.slice.call(head.rows[0].cells);
        headers.forEach((th, col) => {
            const button = doc.createElement('button');
            button.type = 'button';
            button.className = 'wr-sort';
            while (th.firstChild)
                button.appendChild(th.firstChild);
            const icon = doc.createElement('span');
            icon.className = 'wr-sort-icon';
            icon.setAttribute('aria-hidden', 'true');
            button.appendChild(icon);
            th.appendChild(button);
            button.addEventListener('click', () => {
                const ascending = th.getAttribute('aria-sort') !== 'ascending';
                headers.forEach((h) => h.removeAttribute('aria-sort'));
                th.setAttribute('aria-sort', ascending ? 'ascending' : 'descending');
                const cellText = (row) => (row.cells[col] ? row.cells[col].textContent || '' : '').trim();
                Array.prototype.slice
                    .call(body.rows)
                    .sort((a, b) => (ascending ? 1 : -1) * collator.compare(cellText(a), cellText(b)))
                    .forEach((row) => body.appendChild(row));
            });
        });
    });
    if (typeof HTMLDialogElement === 'undefined')
        return null;
    const photoIndex = {};
    (ctx.albums || []).forEach((album) => {
        (album.photos || []).forEach((photo, index) => {
            photoIndex[photo.id] = { album: album, index: index };
        });
    });
    const itemIndex = {};
    (ctx.items || []).forEach((item) => {
        itemIndex[item.id] = item;
    });
    const dialog = doc.createElement('dialog');
    dialog.className = 'wr-dialog';
    doc.body.appendChild(dialog);
    let current = null;
    let opener = null;
    let touchX = null;
    const setHash = (hash) => {
        try {
            history.replaceState(null, '', location.pathname + location.search + (hash ? '#' + hash : ''));
        }
        catch (e) {
            // sandboxed previews may refuse; the dialog still works
        }
    };
    const show = () => {
        if (!dialog.open)
            dialog.showModal();
        const close = dialog.querySelector('[data-wr="close"]');
        if (close)
            close.focus();
    };
    const bar = (label, extra) => '<div class="wr-bar"><span>' + label + '</span><div class="wr-bar-buttons">' + (extra || '') +
        '<button type="button" class="wr-close" data-wr="close" aria-label="Close">✕</button></div></div>';
    // Full screen shows the photo as large as the screen allows. A <dialog> can't go full screen
    // itself, so the lightbox inside it does; browsers without element full screen (iPhone) get no button.
    const canFullscreen = !!doc.fullscreenEnabled;
    const fullscreenLightbox = () => {
        const el = doc.fullscreenElement;
        return el && dialog.contains(el) ? el : null;
    };
    const fullscreenIcon = (on) => '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' +
        (on ? 'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5' : 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5') + '"/></svg>';
    const fullscreenButton = (on) => {
        const label = on ? 'Exit full screen' : 'Full screen';
        return '<button type="button" class="wr-close" data-wr="fullscreen" aria-label="' + label + '" title="' + label + '">' + fullscreenIcon(on) + '</button>';
    };
    const toggleFullscreen = () => {
        if (fullscreenLightbox()) {
            doc.exitFullscreen().catch(() => undefined);
            return;
        }
        const lightbox = dialog.querySelector('.wr-lightbox');
        if (canFullscreen && lightbox && lightbox.requestFullscreen)
            lightbox.requestFullscreen().catch(() => undefined);
    };
    const showPhoto = (photoId) => {
        const entry = photoIndex[photoId];
        if (!entry)
            return false;
        current = entry;
        const album = entry.album;
        const photos = album.photos;
        const photo = photos[entry.index];
        const many = photos.length > 1;
        const title = photo.caption || album.title;
        dialog.setAttribute('aria-label', 'Photo: ' + title);
        const full = fullscreenLightbox();
        const content = bar(esc(album.title) + (many ? ' · ' + (entry.index + 1) + ' / ' + photos.length : ''), canFullscreen ? fullscreenButton(!!full) : '') +
            '<div class="wr-stage">' +
            (many ? '<button type="button" class="wr-nav wr-prev" data-wr="prev" aria-label="Previous photo">‹</button>' : '') +
            '<img src="' + safeUrl(photo.url) + '" alt="' + esc(photo.altText || photo.caption) + '"' + (canFullscreen ? ' title="Double-click for full screen"' : '') + ' />' +
            (many ? '<button type="button" class="wr-nav wr-next" data-wr="next" aria-label="Next photo">›</button>' : '') +
            '</div><div class="wr-caption">' +
            (photo.caption ? '<p class="wr-title">' + esc(photo.caption) + '</p>' : '') +
            (photo.altText && photo.altText !== photo.caption ? '<p class="wr-muted">' + esc(photo.altText) + '</p>' : '') +
            ((photo.tags || []).length ? '<p class="wr-muted">' + photo.tags.map((t) => '#' + esc(t)).join(' ') + '</p>' : '') +
            '<div class="wr-actions">' +
            '<a href="' + link('like', photo.canonicalUrl, title, photo.url, 'photo') + '">♥ Like</a>' +
            '<a href="' + link('share', photo.canonicalUrl, title, photo.url, 'photo') + '">↻ Share</a>' +
            '<a href="' + safeUrl(photo.url) + '" target="_blank" rel="noopener noreferrer" data-wr-full-size>Open full size</a>' +

    const showPost = (itemId) => {

    };
    // Hand-off to Webring Studio: explain the step and offer web fallbacks before the browser's own
    // "open this application?" prompt, which pages can't change. "Don't ask again" skips this sheet.
    const HANDOFF_KEY = 'webring-studio-handoff';
    const askFirst = () => {

            return true;

    let handoffUrl = '';
    const showHandoff = (href) => {
        let params;

            params = new URL(href).searchParams;
        }
        catch (e) {
            return false;
        }
        const action = params.get('action') || '';
        const title = params.get('title') || '';
        const target = params.get('targetUrl') || '';
        const quoted = title ? ' “' + esc(title) + '”' : '';
        const heading = action === 'like' ? 'Like' + quoted
            : action === 'share' ? 'Share' + quoted
                : action === 'comment' ? 'Comment on' + quoted
                    : action === 'friend' ? 'Add ' + esc(title || 'this site') + ' as a friend'
                        : action === 'join-ring' ? 'Join the' + quoted + ' webring'
                            : 'Open in Webring Studio';
        const isWeb = /^https?:\/\//i.test(target);
        // A post or photo on this page: copy its page link (#post-…, #photo-…), not the JSON address
        const pageBase = /^https?:$/.test(location.protocol)
            ? location.href.split('#')[0]
            : String(ctx.profile.siteUrl || '').replace(/\/?$/, '/');
        let webLink = target;
        const item = (ctx.items || []).find((i) => i.canonicalUrl === target);
        const photoId = Object.keys(photoIndex).find((id) => {
            const entry = photoIndex[id];
            return entry.album.photos[entry.index].canonicalUrl === target;
        });
        if (item)
            webLink = pageBase + '#post-' + encodeURIComponent(item.id);
        else if (photoId)
            webLink = pageBase + '#photo-' + encodeURIComponent(photoId);
        handoffUrl = isWeb ? webLink : '';
        current = null;
        dialog.setAttribute('aria-label', heading.replace(/&[^;]+;/g, ''));
        dialog.innerHTML =
            '<div class="wr-sheet card-surface"><div class="wr-sheet-head"><h2>' + heading + '</h2>' +
                '<button type="button" class="wr-close" data-wr="close" aria-label="Close">✕</button></div>' +
                '<p class="wr-sheet-note">This happens in <strong>Webring Studio</strong>, the free desktop app behind this site. Your browser will ask before opening it; choose <em>Always allow</em>, where offered, to skip that next time.</p>' +
                '<a class="wr-go" data-wr-go href="' + esc(href) + '">Open in Webring Studio</a>' +
                '<label class="wr-sheet-check"><input type="checkbox" data-wr-remember /> Don’t ask again on this site</label>' +
                (isWeb
                    ? '<div class="wr-sheet-alt"><p>No app? ' + (action === 'join-ring' ? 'Copy the ring’s address:' : action === 'friend' ? 'Copy the site’s address:' : 'Copy the link:') + '</p>' +
                        '<div class="wr-sheet-copy"><input type="text" readonly value="' + esc(handoffUrl) + '" aria-label="Link" />' +
                        '<button type="button" data-wr="copy">Copy</button>' +
                        (typeof navigator.share === 'function' && action !== 'join-ring' ? '<button type="button" data-wr="share">Share…</button>' : '') +
                        '</div></div>'
                    : '') +
                '<a class="wr-sheet-about" href="' + safeUrl(ctx.projectUrl) + '" target="_blank" rel="noopener noreferrer">What’s Webring Studio?</a></div>';
        show();
        return true;
    };
    const isHandoffLink = (el) => el && /^webring:/i.test(el.getAttribute('href') || '') && !el.hasAttribute('data-wr-go');
    const maybeHandoff = (ev) => {
        if (ev.defaultPrevented || ev.button > 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey)
            return false;
        const anchor = ev.target && ev.target.closest ? ev.target.closest('a[href]') : null;
        if (!isHandoffLink(anchor) || !askFirst())
            return false;
        if (!showHandoff(anchor.getAttribute('href')))
            return false;
        ev.preventDefault();
        if (!opener)
            opener = anchor;
        return true;
    };
    root.addEventListener('click', maybeHandoff);
    const step = (delta) => {
        if (!current)
            return;
        const photos = current.album.photos;
        showPhoto(photos[(current.index + delta + photos.length) % photos.length].id);
    };
    root.addEventListener('click', (ev) => {
        if (ev.defaultPrevented || ev.button > 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey)
            return;
        const target = ev.target && ev.target.closest ? ev.target.closest('[data-lightbox], [data-open-post]') : null;
        if (!target)
            return;
        const opened = target.hasAttribute('data-open-post')
            ? showPost(target.getAttribute('data-open-post'))
            : showPhoto(target.getAttribute('data-photo-id'));
        if (opened) {
            ev.preventDefault();
            opener = target;
        }
    });
    dialog.addEventListener('click', (ev) => {
        if (ev.target === dialog)
            return dialog.close(); // backdrop
        if (maybeHandoff(ev))
            return; // Like / Share in the lightbox or post view
        const go = ev.target && ev.target.closest ? ev.target.closest('[data-wr-go]') : null;
        if (go) {
            const remember = dialog.querySelector('[data-wr-remember]');
            if (remember && remember.checked) {
                try {
                    localStorage.setItem(HANDOFF_KEY, 'direct');
                }
                catch (e) {
                    // private mode: the sheet will simply show again
                }
            }
            setTimeout(() => dialog.close(), 300); // let the browser start the hand-off first
            return;
        }
        const button = ev.target && ev.target.closest ? ev.target.closest('[data-wr]') : null;
        if (!button)
            return;
        const action = button.getAttribute('data-wr');
        if (action === 'close')
            dialog.close();
        else if (action === 'fullscreen')
            toggleFullscreen();
        else if (action === 'copy') {
            const field = dialog.querySelector('.wr-sheet-copy input');
            const done = () => {
                button.textContent = 'Copied ✓';
            };
            const fallback = () => {
                if (!field)
                    return;
                field.select();
                let copied = false;
                try {
                    copied = doc.execCommand('copy');
                }
                catch (e) {
                    copied = false;
                }
                if (copied)
                    done();
                else
                    button.textContent = 'Press Ctrl/⌘+C';
            };
            if (navigator.clipboard && navigator.clipboard.writeText)
                navigator.clipboard.writeText(handoffUrl).then(done, fallback);
            else
                fallback();
        }
        else if (action === 'share') {
            navigator.share({ url: handoffUrl }).catch(() => undefined);
        }
        else
            step(action === 'prev' ? -1 : 1);
    });
    dialog.addEventListener('keydown', (ev) => {
        if (!current)
            return;
        if (ev.key === 'ArrowLeft')
            step(-1);
        else if (ev.key === 'ArrowRight')
            step(1);
        else if (ev.key === 'f' && canFullscreen && !ev.metaKey && !ev.ctrlKey && !ev.altKey)
            toggleFullscreen();
    });
    dialog.addEventListener('dblclick', (ev) => {
        if (current && ev.target && ev.target.closest && ev.target.closest('.wr-stage img'))
            toggleFullscreen();
    });
    doc.addEventListener('fullscreenchange', () => {
        const button = dialog.querySelector('[data-wr="fullscreen"]');
        if (button)
            button.outerHTML = fullscreenButton(!!fullscreenLightbox());
    });
    dialog.addEventListener('touchstart', (ev) => {
        touchX = ev.touches && ev.touches[0] ? ev.touches[0].clientX : null;
    }, { passive: true });
    dialog.addEventListener('touchend', (ev) => {
        const endX = ev.changedTouches && ev.changedTouches[0] ? ev.changedTouches[0].clientX : null;
        if (current && touchX !== null && endX !== null && Math.abs(endX - touchX) > 50)
            step(endX < touchX ? 1 : -1);
        touchX = null;
    });
    dialog.addEventListener('close', () => {
        if (fullscreenLightbox())
            doc.exitFullscreen().catch(() => undefined);
        current = null;
        dialog.innerHTML = '';
        setHash('');
        if (opener && opener.focus)
            opener.focus();
        opener = null;
    });
    // #post-<id> and #photo-<id> open on load and when the address changes
    const openFromHash = () => {
        const match = /^#(post|photo)-(.+)$/.exec(location.hash || '');
        if (!match)
            return;
        let id = match[2];
        try {
            id = decodeURIComponent(id);
        }
        catch (e) {
            return;
        }
        if (match[1] === 'post')
            showPost(id);
        else
            showPhoto(id);
    };
    window.addEventListener('hashchange', openFromHash);
    openFromHash();
    // Older posts loaded later (archives) can be opened in the post view too
    return {
        addItems: (items) => {
            (items || []).forEach((item) => {
                itemIndex[item.id] = item;
            });
        },
    };
};
      let enhancements = null;
      if (installPageEnhancements && !(profile.appearance && profile.appearance.interactions === 'off')) {
        try {
          enhancements = installPageEnhancements({ root, profile, albums: allAlbums, items: allItems, esc, safeUrl, buildDeepLink, renderItem, projectUrl: "https://github.com/lnsCorey/webring-studio" });
        } catch (err) {
          console.warn('Interactive extras unavailable:', err);
        }
      }

      // Loading an archive month appends its posts in the page's layout
      async function loadArchiveItems(url) {
        const embedded = window.__WEBRING_ARCHIVES__;
        let doc = embedded && Object.prototype.hasOwnProperty.call(embedded, url) ? embedded[url] : null;
        if (!doc && window.location.protocol.startsWith('http')) {
          const res = await fetch('./' + String(url).replace(/^\/+/, ''), { credentials: 'omit', cache: 'no-cache' });
          if (res.ok) doc = await res.json();
        }
        if (!doc || !Array.isArray(doc.items)) throw new Error('Archive unavailable');
        return doc.items.filter(i => i && typeof i.id === 'string' && typeof i.canonicalUrl === 'string');
      }
      root.addEventListener('click', async function(ev) {
        const button = ev.target && ev.target.closest ? ev.target.closest('[data-archive-url]') : null;
        if (!button || button.disabled) return;
        const list = root.querySelector('[data-archive-list]');
        if (!list) return;
        button.disabled = true;
        try {
          const loaded = await loadArchiveItems(button.getAttribute('data-archive-url'));
          loaded.forEach(i => allItems.push(i));
          if (enhancements && enhancements.addItems) enhancements.addItems(loaded);
          const group = document.createElement('div');
          group.className = 'older-month-items mb-8';
          group.innerHTML = '<h3 class="text-lg font-bold mb-3">' + esc(button.getAttribute('data-archive-label')) + '</h3>' +
            '<div class="' + archiveView.wrapClass + '">' + loaded.map(archiveView.renderItem).join('') + '</div>';
          list.appendChild(group);
          button.classList.add('opacity-50');
        } catch (err) {
          button.disabled = false;
          button.setAttribute('title', 'Couldn\'t load this month. Try again.');
        }
      });

      // Initialize any rendered AdSense slots
      if (profile.adsAddon && profile.adsAddon.enabled && typeof window !== 'undefined') {
        const adNodes = root.querySelectorAll('ins.adsbygoogle');
        adNodes.forEach(() => {
          try {
            (window.adsbygoogle = window.adsbygoogle || []).push({});
          } catch (e) {}
        });
      }

      // Optional GA4 Webring interaction click tracking
      if (profile.analyticsAddon && profile.analyticsAddon.enabled && profile.analyticsAddon.trackRingInteractions !== false && typeof window.gtag === 'function') {
        root.addEventListener('click', function(ev) {
          const anchor = ev.target && ev.target.closest ? ev.target.closest('a[href^="webring://"]') : null;
          if (anchor) {
            window.gtag('event', 'webring_interact', {
              href: anchor.getAttribute('href') || ''
            });
          }
        });
      }
    })();
  </script>
